services:
  word-counter-bot:
    image: ghcr.io/mentalezuflucht/word-counter-bot:latest
    container_name: word-counter-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - logs:/app/logs
    networks:
      br0:
        ipv4_address: ${BOT_IP:?Set BOT_IP in .env}
    labels:
      - com.centurylinklabs.watchtower.enable=true

networks:
  br0:
    external: true

volumes:
  logs:
